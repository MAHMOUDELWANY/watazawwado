    <!-- Fonts are not preloaded: text shows at once in a system font (font-display: swap) and the
         Thmanyah fonts replace it when they arrive, so they never delay the first paint on phones. -->

    <script>
      (function() {
        try {
          var p = location.pathname;
          var saved = (p === '/en' || p.indexOf('/en/') === 0) ? 'en' : localStorage.getItem('watazawwado_lang');
          var l = (saved === 'en') ? 'en' : 'ar';
          document.documentElement.lang = l;
          document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
          var t = localStorage.getItem('mahmoud_theme');
          if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
          // Launch screen: inside the installed app, and on the account areas (never over the public pages,
          // which arrive prerendered and must show at once).
          var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
          if (standalone || /^\/(student|dashboard|teacher|staff)(\/|$)/.test(p)) {
            document.documentElement.classList.add('boot-app');
          }
          // Opening the installed app plays the short brand intro once a day; the splash stays for it.
          var day = new Date().toDateString();
          if (standalone && localStorage.getItem('wz_intro_day') !== day && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            localStorage.setItem('wz_intro_day', day);
            document.documentElement.classList.add('boot-intro');
            window.__bootIntroUntil = Date.now() + 1500;
          }
        } catch(e) {}
      })();
    </script>
    <style>
      #boot-splash { display: none; }
      .boot-app #boot-splash {

        transition: opacity .28s ease, visibility .28s ease;

      .boot-app.dark #boot-splash { background: #110F0E; }
      #boot-splash.is-leaving { opacity: 0; visibility: hidden; }
      #boot-splash .bs-tile {
        width: 112px; height: 112px; border-radius: 28px; display: grid; place-items: center; background: #FAF7F2;
        box-shadow: 0 0 0 1px rgba(229,169,60,.55), 0 22px 44px -22px rgba(5,54,63,.55);
        animation: bs-in .5s cubic-bezier(.22,1,.36,1) both;
      }
      #boot-splash .bs-tile img { width: 80px; height: auto; }
      #boot-splash .bs-bar { width: 96px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(139,73,53,.14); }
      .dark #boot-splash .bs-bar { background: rgba(250,247,242,.12); }
      #boot-splash .bs-bar i {
        display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #C51F24, #E5A93C, #12A4BC);
        animation: bs-run 1.1s cubic-bezier(.65,0,.35,1) infinite;
      }
      [dir="rtl"] #boot-splash .bs-bar i { animation-direction: reverse; }
      @keyframes bs-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
      @keyframes bs-run { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      #boot-splash .bs-mark { position: relative; width: 148px; height: 148px; display: none; place-items: center; }
      #boot-splash .bs-mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #boot-splash .bs-mark rect { fill: none; stroke: #E5A93C; stroke-width: 2.5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: bs-draw .7s cubic-bezier(.65,0,.35,1) forwards; }
      #boot-splash .bs-mark rect + rect { animation-delay: .18s; }
      #boot-splash .bs-mark img { width: 76px; height: auto; opacity: 0; transform: scale(.86); animation: bs-pop .5s cubic-bezier(.22,1,.36,1) .55s forwards; }
      #boot-splash .bs-name { display: none; font: 700 22px/1.2 'Thmanyah Serif Display', 'Thmanyah Sans', serif; color: #0A2E35; opacity: 0; animation: bs-rise .45s ease-out .85s forwards; }
      .dark #boot-splash .bs-name { color: #FAF7F2; }
      .boot-intro #boot-splash .bs-tile { display: none; }
      .boot-intro #boot-splash .bs-mark { display: grid; }
      .boot-intro #boot-splash .bs-name { display: block; }
      .boot-intro #boot-splash .bs-bar { opacity: 0; animation: bs-rise .3s ease-out 1.5s forwards; }
      @keyframes bs-draw { to { stroke-dashoffset: 0; } }
      @keyframes bs-pop { to { opacity: 1; transform: none; } }
      @keyframes bs-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .bs-tile, #boot-splash .bs-bar i { animation: none; } }
    </style>
