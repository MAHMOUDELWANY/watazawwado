<!doctype html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Mahmoud | 1-on-1 Quran, Arabic & Islamic Studies</title>
    <meta name="description" content="Personalized 1-on-1 teaching in Quran reading, Tajweed, Arabic language, and Islamic Studies directly with Mahmoud for international learners and families." />
    <meta property="og:title" content="Mahmoud | 1-on-1 Quran, Arabic & Islamic Studies" />
    <meta property="og:description" content="Personalized 1-on-1 teaching in Quran reading, Tajweed, Arabic language, and Islamic Studies directly with Mahmoud for international learners and families." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Watazawwado" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#087D91" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Thmanyah Font Family Preload -->
    <link rel="preload" href="/fonts/thmanyah/thmanyahserifdisplay-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyah/thmanyahserifdisplay-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyah/thmanyahserifdisplay-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyah/thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyah/thmanyahsans-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyah/thmanyahsans-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Google Fonts — Async loading for performance -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('watazawwado_lang');
          var l = (saved === 'en') ? 'en' : 'ar';
          document.documentElement.lang = l;
          document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
          var t = localStorage.getItem('mahmoud_theme');
          if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body class="bg-background text-foreground antialiased overflow-x-hidden min-h-screen selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
